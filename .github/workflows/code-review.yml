name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-code-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev

      - name: Prepare PR diff
        run: |
          git diff "${{ github.event.pull_request.base.sha }}"..."${{ github.sha }}" \
            -- . ':(exclude)package-lock.json' ':(exclude)*.lock' > pr.diff
          wc -c pr.diff

      - name: Run code review agent
        id: agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          SDK_MODEL: composer-2.5
        run: node scripts/code-review-agent.mjs --ci --json-out review.json pr.diff

      - name: Post review comment on PR
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SDK_MODEL: composer-2.5
        run: node scripts/post-pr-review-comment.mjs review.json

      - name: Enforce merge gate
        if: success()
        run: |
          node -e "
            const review = require('./review.json');
            if (review.overall_verdict !== 'APPROVE') {
              console.error('Merge gate: ' + review.overall_verdict);
              process.exit(1);
            }
            console.log('Merge gate: APPROVE');
          "
